name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: rideshare_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/rideshare_test
      NODE_ENV: test
      TZ: Asia/Manila

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Throwaway values for this run only; never the real secrets.
      - name: Test secrets
        run: |
          echo "JWT_SECRET=$(openssl rand -base64 33)" >> "$GITHUB_ENV"
          echo "PII_ENCRYPTION_KEY=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma db push
      - run: npm run test:server
      - run: npm run test:web
      - name: Type check
        run: |
          npx next typegen
          npx tsc --noEmit
